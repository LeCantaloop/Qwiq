name: Release

on:
  workflow_dispatch:
    # Allow manual triggering for testing
  release:
    types:
      - published # Run when a new GitHub release is published
      - edited
      - prereleased
      - released
  push:
    tags:
      - "v*" # Run on version tags (e.g., v2.0.0, v2.1.0-beta.1)

permissions:
  contents: write # Required for creating GitHub releases and attaching SLSA provenance
  packages: read
  actions: read
  id-token: write # Required for SLSA provenance generation

jobs:
  # Reuse the main build workflow for build/test/pack
  build:
    uses: ./.github/workflows/main.yml
    permissions:
      contents: read
      actions: read

  # Compute hashes of build artifacts for SLSA provenance
  hashes:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}

    steps:
      - name: Download packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: packages
          path: packages

      - name: Compute hashes
        id: hash
        shell: pwsh
        run: |
          # Compute SHA256 hashes of all .nupkg files (no .snupkg - using embedded symbols)
          $nupkgFiles = Get-ChildItem -Path ./packages -Filter '*.nupkg' -Recurse
          $hashes = $nupkgFiles | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            $relativePath = $_.FullName.Replace((Get-Location).Path + [IO.Path]::DirectorySeparatorChar, '').Replace('\', '/')
            "$hash  $relativePath"
          }
          $base64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(($hashes -join "`n")))
          echo "hashes=$base64" >> $env:GITHUB_OUTPUT

  # Generate SLSA Level 3 provenance for supply chain security
  provenance:
    needs: [build, hashes]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: "${{ needs.hashes.outputs.hashes }}"
      provenance-name: "qwiq-provenance.intoto.jsonl"
      upload-assets: true

  # Publish packages to NuGet after successful build
  # SBOM is generated by main.yml build job (artifact: sbom-windows-latest)
  publish:
    needs: [build, provenance]
    runs-on: windows-latest # Required for net472 packages
    environment:
      name: production-nuget
      url: https://www.nuget.org/packages/Qwiq.Core

    steps:
      - name: Download packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: packages
          path: packages

      - name: List packages
        shell: pwsh
        run: |
          Write-Host "📦 Packages to publish:"
          Get-ChildItem ./packages -Recurse -Include *.nupkg | ForEach-Object {
            Write-Host "  - $($_.Name)"
          }

      - name: Publish to NuGet
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          $nupkgFiles = Get-ChildItem ./packages -Recurse -Include *.nupkg

          Write-Host "🚀 Publishing $($nupkgFiles.Count) packages to NuGet..."

          foreach ($file in $nupkgFiles) {
            Write-Host "Publishing: $($file.Name)"
            dotnet nuget push $file.FullName --api-key "$env:NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Failed to push $($file.Name), but continuing..."
            }
          }

          Write-Host "✅ NuGet publishing complete!"

      - name: Download SLSA provenance
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: qwiq-provenance.intoto.jsonl
          path: provenance

      - name: Download SBOM
        # SBOM is generated by main.yml build job on Windows
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: sbom-windows-latest
          path: sbom

      - name: Upload packages to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          files: |
            packages/**/*.nupkg
            provenance/**/*.intoto.jsonl
            sbom/**/*.spdx.json
          generate_release_notes: true
          fail_on_unmatched_files: false
