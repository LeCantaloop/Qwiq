name: Main build

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    # Run for ALL pull requests regardless of target branch
  workflow_dispatch:
    # Allow manual triggering of the build
  workflow_call:
    # Allow this workflow to be called by other workflows (e.g., release.yml)
    # This enables DRY reuse of the build/test/pack logic

permissions:
  contents: read
  actions: read

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.os }})

    env:
      # Test filter matching AppVeyor configuration
      # WireMock tests are excluded because they require HTTPS which needs elevated privileges
      # for SSL certificate binding - this fails on GitHub Actions runners
      TEST_FILTER: "TestCategory!=localOnly&TestCategory!=Benchmark&TestCategory!=SOAP&TestCategory!=REST&TestCategory!=IntegrationTests&TestCategory!=WireMock"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: ./.github/actions/setup-dotnet

      - name: Setup Node.js
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint markdown files
        # Verify all markdown files pass linting (no auto-fix in CI)
        # This catches commits that bypassed the pre-commit hook
        # Only run on Ubuntu - markdown linting is platform-agnostic
        if: matrix.os == 'ubuntu-latest'
        run: npx markdownlint-cli2 "**/*.md"

      - name: Restore and Build (Windows)
        # Windows: Use /t:Build,Pack to ensure all packages are generated during build.
        # This produces packages for all target frameworks including net472.
        if: matrix.os == 'windows-latest'
        uses: ./.github/actions/restore-build
        with:
          enable-pack: "true"
          generate-binlog: "true"

      - name: Restore and Build (Linux)
        # Linux: Build solution without packing.
        # Linux cannot build net472 (requires Windows/.NET Framework), so we skip packing.
        # The SDK automatically filters out Windows-only TFMs during inner builds.
        # Packages are only produced on Windows where all TFMs can be built.
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/restore-build
        with:
          enable-pack: "false"
          generate-binlog: "true"

      - name: Validate package output
        # Scans csproj files to find packable projects and validates each produced
        # both .nupkg and .snupkg files. Fails the build if any are missing.
        # Only run on Windows (Linux builds don't generate all packages)
        if: matrix.os == 'windows-latest'
        run: ./build/scripts/Validate-PackageOutput.ps1

      - name: Verify Source Link
        # Only run on push events (develop/master), not on pull_request events.
        # During PR checks, GitHub creates a temporary merge commit that sourcelink
        # cannot validate because the commit doesn't persist on GitHub's raw content server.
        # Only run on Windows builds (Linux builds don't generate all packages)
        if: github.event_name == 'push' && matrix.os == 'windows-latest'
        run: ./build/scripts/Verify-SourceLink.ps1

      - name: Run tests with coverage (Windows)
        id: test-windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        # Run all tests on Windows where all TFMs are built.
        # The test filter excludes integration tests that require server connectivity.
        run:
          dotnet test Qwiq.sln -c Release --no-build --filter "${{ env.TEST_FILTER }}" --logger trx --results-directory
          ./artifacts/TestResults --collect:"XPlat Code Coverage" --settings coverage.runsettings

      - name: Run tests with coverage (Linux)
        id: test-linux
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        # Run tests on Linux with net8.0 only.
        # Exclude IntegrationTests (net472-only, would require Mono).
        # Exclude Package.Tests (requires .nupkg files which are only built on Windows).
        # Benchmark tests are excluded by TEST_FILTER (TestCategory!=Benchmark).
        # Test multi-targeted projects by explicitly specifying --framework net8.0.
        run: |
          $projects = @(
            'test/Qwiq.Core.Tests/Qwiq.Core.UnitTests.csproj',
            'test/Qwiq.Identity.Tests/Qwiq.Identity.UnitTests.csproj',
            'test/Qwiq.Linq.Tests/Qwiq.Linq.UnitTests.csproj',
            'test/Qwiq.Mapper.Tests/Qwiq.Mapper.UnitTests.csproj'
          )
          foreach ($project in $projects) {
            dotnet test $project -c Release --no-build --framework net8.0 --filter "${{ env.TEST_FILTER }}" --logger trx --results-directory ./artifacts/TestResults --collect:"XPlat Code Coverage" --settings coverage.runsettings
          }

      - name: Upload build logs
        if: success() || failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs-${{ matrix.os }}
          path: ./artifacts/logs/
          if-no-files-found: ignore

      - name: Generate coverage report
        if:
          always() && (steps.test-windows.outcome == 'success' || steps.test-windows.outcome == 'failure' ||
          steps.test-linux.outcome == 'success' || steps.test-linux.outcome == 'failure')
        shell: pwsh
        run:
          dotnet reportgenerator -reports:"./artifacts/TestResults/**/coverage.cobertura.xml"
          -targetdir:"./artifacts/CoverageReport" -reporttypes:"Cobertura;HtmlSummary;HtmlInline_AzurePipelines"

      - name: Upload test results
        if:
          always() && (steps.test-windows.outcome == 'success' || steps.test-windows.outcome == 'failure' ||
          steps.test-linux.outcome == 'success' || steps.test-linux.outcome == 'failure')
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.os }}
          path: ./artifacts/TestResults/**/*.trx
          if-no-files-found: ignore

      - name: Upload coverage report
        if:
          always() && (steps.test-windows.outcome == 'success' || steps.test-windows.outcome == 'failure' ||
          steps.test-linux.outcome == 'success' || steps.test-linux.outcome == 'failure')
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report-${{ matrix.os }}
          path: ./artifacts/CoverageReport/
          if-no-files-found: ignore

      - name: Upload binaries
        uses: actions/upload-artifact@v6
        if: success()
        with:
          name: binaries-${{ matrix.os }}
          path: |
            src/**/bin/Release/**/*.dll
            src/**/bin/Release/**/*.exe
            !src/**/bin/Release/**/*.pdb
          if-no-files-found: warn

      - name: Upload packages
        uses: actions/upload-artifact@v6
        # Only upload packages from Windows build (Linux doesn't build all packages)
        if: success() && matrix.os == 'windows-latest'
        with:
          name: packages
          path: |
            src/**/bin/Release/**/*.nupkg
            src/**/bin/Release/**/*.snupkg
            test/**/bin/Release/**/*.nupkg
            test/**/bin/Release/**/*.snupkg
          if-no-files-found: warn

      - name: Get version from nbgv
        id: nbgv
        shell: pwsh
        run: |
          $version = dotnet nbgv get-version -v NuGetPackageVersion
          Write-Host "Version: $version"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Generate SBOM
        # Generate SBOM for build artifacts
        # Uses local .NET tool (restored via dotnet tool restore) instead of container action
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./artifacts/sbom -Force | Out-Null
          dotnet sbom-tool generate -b ./src -bc ./ -pn Qwiq -pv ${{ steps.nbgv.outputs.version }} -ps "Qwiq Contributors" -nsb https://github.com/rjmurillo/Qwiq -m ./artifacts/sbom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v6
        if: success()
        with:
          name: sbom-${{ matrix.os }}
          path: ./artifacts/sbom/
          if-no-files-found: warn
